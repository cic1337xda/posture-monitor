<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d63dd"/>
      <stop offset="100%" stop-color="#1d2e5c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Liquid Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Stylized Ergonomic Posture Spine & Head -->
  <!-- Head -->
  <circle cx="64" cy="34" r="11" fill="#ffffff"/>
  
  <!-- Spine Line (S-curve alignment) -->
  <path d="M 64 48 C 64 56, 70 64, 70 76 C 70 88, 62 94, 62 102" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Shoulders -->
  <line x1="42" y1="56" x2="86" y2="56" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Posture Alignment Nodes (Cyan Glowing Accents) -->
  <circle cx="64" cy="56" r="4" fill="#a6bff9" filter="url(#glow)"/>
  <circle cx="70" cy="76" r="4" fill="#a6bff9" filter="url(#glow)"/>
  <circle cx="62" cy="98" r="4" fill="#a6bff9" filter="url(#glow)"/>
</svg>
